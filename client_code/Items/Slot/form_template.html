<div class="pc-item-host"><div class="ce-slot" anvil:dom-node="row">
  <button type="button" class="ph" anvil:dom-node="photo_btn"><img anvil:dom-node="img" alt="" hidden><span anvil:dom-node="add"><i class="ic ic-camera"></i>Add photo</span></button>
  <div class="fields">
    <anvil-component type="TextBox" name="name_box" prop:placeholder="Star's name" prop:role='["ce-name"]'></anvil-component>
    <anvil-component type="TextBox" name="note_box" prop:placeholder="Why them? (optional)"></anvil-component>
  </div>
  <div class="tools">
    <anvil-component type="Button" name="lead_button" prop:text="Make lead" prop:tooltip="Make lead" prop:role='["btn", "btn-ghost", "btn-icon", "ic-crown"]'></anvil-component>
    <anvil-component type="Button" name="remove_button" prop:text="Remove" prop:tooltip="Remove" prop:role='["btn", "btn-ghost", "btn-icon", "ic-x"]'></anvil-component>
    <anvil-component type="Button" name="up_button" prop:text="Move up" prop:tooltip="Move up" prop:role='["btn", "btn-ghost", "btn-icon", "ic-up"]'></anvil-component>
    <anvil-component type="Button" name="down_button" prop:text="Move down" prop:tooltip="Move down" prop:role='["btn", "btn-ghost", "btn-icon", "ic-down"]'></anvil-component>
  </div>
</div></div>

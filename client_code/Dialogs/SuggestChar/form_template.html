<div class="ui dlg-host">
  <h2 class="dlg-h">Add a missing character</h2>
  <p class="muted">An admin checks it, then everyone can cast them.</p>
  <div class="ui-stack">
    <label class="ui-field"><span>Name</span>
      <anvil-component type="TextBox" name="name_box"></anvil-component>
    </label>
    <label class="ui-field"><span>Role</span>
      <anvil-component type="DropDown" name="role_box"></anvil-component>
    </label>
    <label class="ui-field"><span>Who are they? <em>(optional, no spoilers please)</em></span>
      <anvil-component type="TextArea" name="blurb_box" prop:height="80"></anvil-component>
    </label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="send_button" prop:text="Send" prop:role='["btn", "btn-primary"]'></anvil-component>
    </div>
  </div>
</div>

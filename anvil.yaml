    <noscript><div class="seo-noscript">
    <h1>PerfectCast: fan-cast every new romantasy book</h1>
    <p>Fan-cast the newest romantasy books: every character, your dream celebrity collage, and what the whole fandom picks. Swoon over and comment on other readers&#x27; casts.</p>
    <p>PerfectCast is a fan-casting site for romantasy readers. Every new romantasy book is listed with its cover, blurb, tropes and spice level, and every character in it.</p>
    <p>Fans make photo collages of the celebrities they would cast in a film, swoon over and comment on each other&#x27;s collages, and every character shows the fans&#x27; pick. A calmer, prettier home for fan-casts than forum threads.</p>
    <p>Who it's for: Romantasy readers and BookTok fans</p>
    <h2>What it does</h2><ul><li>Every new romantasy book with tropes, spice level and characters</li><li>Make a dream-cast collage and save it as an image for socials</li><li>The fans&#x27; pick for every character, with vote shares</li><li>Swoons, comments and fan pages</li><li>A leaderboard of the most-cast celebrities</li></ul>
    <h2>Questions</h2><h3>Can I browse without an account?</h3><p>Yes. Books, characters, collages and the star leaderboard are open to everyone.</p><h3>How is the fans&#x27; pick decided?</h3><p>Every collage counts as a vote for each star in it; the character page shows the top three and every vote.</p><h3>Can I share my collage?</h3><p>Yes. Save it as a 1080x1350 image for socials or share its link.</p>
    <p><a href="https://perfectcast.anvil.app/about">About PerfectCast</a> &middot; <a href="https://perfectcast.anvil.app/llms.txt">PerfectCast for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. PerfectCast needs JavaScript in your browser.</p>
